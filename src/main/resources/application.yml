spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fin_tracker
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  defaults:
    currency: ${APP_DEFAULT_CURRENCY:LKR}

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongToWorkWithHS256Algorithm}
  access-token-expiration: 900000  # 15 minutes in milliseconds
  refresh-token-expiration: 604800000  # 7 days in milliseconds

logging:
  level:
    root: INFO
    com.ceylabs.fintrackerbackend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
